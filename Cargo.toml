[package]
name = "device-viewer"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
description = "Cross-platform hardware information viewer"
license-file = "LICENSE"
publish = false
build = "build.rs"

[features]
default = ["vulkan", "opencl", "metal", "sensors"]
vulkan = ["dep:ash"]
opencl = ["dep:opencl3"]
metal = ["dep:metal"]
openvx = ["dep:openvx"]
sensors = ["sysinfo/component"]

[dependencies]
ash = { version = "0.38.0", optional = true }
cfg-if = "1.0.5"
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.37.0", default-features = false }
glow = "0.17.0"
hwloc = "0.5.0"
opencl3 = { version = "0.12.4", optional = true, default-features = false, features = ["dynamic"] }
openvx = { version = "0.1.3", optional = true }
pci-info = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smartctl-rs = "0.2.0"
sysinfo = { version = "0.40.0", default-features = false, features = [
    "disk",
    "gpu",
    "network",
    "system",
] }
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[[test]]
name = "device_query"
path = "tests/device_query.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
