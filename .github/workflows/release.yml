name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  metadata:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate tag
        id: version
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RAW_TAG#v}"
          if [[ -z "${version}" ]]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Release tag contains unsupported characters: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Windows x86_64
    needs: metadata
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.TARGET }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.TARGET }}-cargo-

      - name: Build release binary
        shell: pwsh
        env:
          DV_BUILD_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --target $env:TARGET --no-default-features --features "vulkan,opencl,sensors"

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "DeviceViewer-windows-x86_64-$env:VERSION"
          $stage = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/device-viewer.exe" (Join-Path $stage "DeviceViewer.exe")
          Copy-Item -Path "LICENSE", "LEGAL_STATEMENT.md", "PRIVACY.md", "DISCLAIMER.md", "packaging/README_PACKAGE.md" -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceViewer-windows-x86_64-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: metadata
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${TARGET}"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DV_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --target "${TARGET}" --no-default-features --features "vulkan,opencl,metal,sensors"

      - name: Stage package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          name="DeviceViewer-macos-${ARCH}-${VERSION}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/${TARGET}/release/device-viewer" "${stage}/DeviceViewer"
          cp LICENSE LEGAL_STATEMENT.md PRIVACY.md DISCLAIMER.md packaging/README_PACKAGE.md "${stage}/"
          chmod +x "${stage}/DeviceViewer"
          cat > "${stage}/SIGNING_AND_NOTARIZATION.txt" <<'EOF'
          Device Viewer macOS package
          ==========================

          This archive is intentionally unsigned and not notarized. No Apple
          Developer certificate, private key, app-specific password or API key
          is included in this repository or in the GitHub Actions workflow.

          Gatekeeper may block the first launch. After verifying the SHA-256
          digest, the user can allow the app in System Settings > Privacy &
          Security, or remove the quarantine attribute manually:

              xattr -dr com.apple.quarantine DeviceViewer

          For a signed and notarized public release, the maintainer must add
          their own Apple Developer ID credentials as protected GitHub Actions
          secrets and run the following steps outside this repository's
          default workflow:

              codesign --force --deep --options runtime \
                --sign "Developer ID Application: <TEAM NAME> (<TEAM ID>)" \
                DeviceViewer

              xcrun notarytool submit DeviceViewer.zip \
                --apple-id "<APPLE ID>" \
                --team-id "<TEAM ID>" \
                --password "<APP-SPECIFIC PASSWORD>" \
                --wait

              xcrun stapler staple DeviceViewer

          Signing and notarization are release-operator responsibilities. The
          workflow never creates, stores or prints credentials.
          EOF
          (cd dist && zip -q -9 -r "${name}.zip" "${name}")
          (cd dist && shasum -a 256 "${name}.zip" > "${name}.zip.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceViewer-macos-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x86_64 musl
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-musl
      VERSION: ${{ needs.metadata.outputs.version }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${TARGET}"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.TARGET }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.TARGET }}-cargo-

      - name: Build release binary
        shell: bash
        env:
          DV_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --target "${TARGET}" --no-default-features --features "vulkan,opencl,sensors"
          file "target/${TARGET}/release/device-viewer"

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          name="DeviceViewer-linux-x86_64-${VERSION}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/${TARGET}/release/device-viewer" "${stage}/DeviceViewer"
          cp LICENSE LEGAL_STATEMENT.md PRIVACY.md DISCLAIMER.md packaging/README_PACKAGE.md "${stage}/"
          chmod +x "${stage}/DeviceViewer"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceViewer-linux-x86_64-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l release-assets
          notes="RELEASE_NOTES_${TAG#v}.md"
          notes_args=(--generate-notes)
          if [[ -f "${notes}" ]]; then
            notes_args=(--notes-file "${notes}")
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
            if [[ -f "${notes}" ]]; then
              gh release edit "${TAG}" --notes-file "${notes}"
            fi
          else
            gh release create "${TAG}" release-assets/* \
              --title "Device Viewer ${TAG#v}" \
              "${notes_args[@]}"
          fi
