name: Release

# 仅在推送 v* 标签时发布。发布前请先确认 Cargo.toml 版本号与
# RELEASE_NOTES_<version>.md 已提交，否则发布说明会回退为标题行。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  metadata:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate tag
        id: version
        shell: bash
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RAW_TAG#v}"
          if [[ -z "${version}" ]]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Release tag contains unsupported characters: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Windows x86_64
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ env.TARGET }}
          workspaces: ". -> target"

      - name: Build release binary
        shell: pwsh
        env:
          DV_BUILD_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --no-default-features --features "vulkan,opencl,sensors" --target $env:TARGET

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "DeviceViewer-windows-x86_64-$env:VERSION"
          $stage = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/device-viewer.exe" (Join-Path $stage "DeviceViewer.exe")
          Copy-Item -Path "LICENSE-MIT", "LICENSE-APACHE", "LEGAL_STATEMENT.md", "PRIVACY.md", "DISCLAIMER.md", "THIRD_PARTY_NOTICES.md", "packaging/README_PACKAGE.md" -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceViewer-windows-x86_64-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x86_64 musl
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-musl
      VERSION: ${{ needs.metadata.outputs.version }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libspeechd-dev \
            libssl-dev \
            libwayland-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ env.TARGET }}
          workspaces: ". -> target"

      - name: Build release binary
        shell: bash
        env:
          DV_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --features "vulkan,opencl,sensors" --target "${TARGET}"
          file "target/${TARGET}/release/device-viewer"

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          name="DeviceViewer-linux-x86_64-${VERSION}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/${TARGET}/release/device-viewer" "${stage}/DeviceViewer"
          cp LICENSE-MIT LICENSE-APACHE LEGAL_STATEMENT.md PRIVACY.md DISCLAIMER.md THIRD_PARTY_NOTICES.md packaging/README_PACKAGE.md "${stage}/"
          chmod +x "${stage}/DeviceViewer"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceViewer-linux-x86_64-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: metadata
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          # macOS aarch64 默认不开启：macos-14 runner 为 arm64，交叉产出
          # x86_64 已在上方；aarch64 仅作为可选构建，需要时取消下面两行注释。
          # - arch: aarch64
          #   target: aarch64-apple-darwin
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}
          workspaces: ". -> target"

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DV_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --features "vulkan,opencl,metal,sensors" --target "${TARGET}"

      - name: Stage package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          name="DeviceViewer-macos-${ARCH}-${VERSION}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/${TARGET}/release/device-viewer" "${stage}/DeviceViewer"
          cp LICENSE-MIT LICENSE-APACHE LEGAL_STATEMENT.md PRIVACY.md DISCLAIMER.md THIRD_PARTY_NOTICES.md packaging/README_PACKAGE.md "${stage}/"
          chmod +x "${stage}/DeviceViewer"
          cat > "${stage}/SIGNING_AND_NOTARIZATION.txt" <<'EOF'
          Device Viewer macOS package
          ==========================

          This archive is intentionally unsigned and not notarized. No Apple
          Developer certificate, private key, app-specific password or API key
          is included in this repository or in the GitHub Actions workflow.

          Gatekeeper may block the first launch. After verifying the SHA-256
          digest, the user can allow the app in System Settings > Privacy &
          Security, or remove the quarantine attribute manually:

              xattr -dr com.apple.quarantine DeviceViewer

          For a signed and notarized public release, the maintainer must add
          their own Apple Developer ID credentials as protected GitHub Actions
          secrets and run the following steps outside this repository's
          default workflow:

              codesign --force --deep --options runtime \
                --sign "Developer ID Application: <TEAM NAME> (<TEAM ID>)" \
                DeviceViewer

              xcrun notarytool submit DeviceViewer.zip \
                --apple-id "<APPLE ID>" \
                --team-id "<TEAM ID>" \
                --password "<APP-SPECIFIC PASSWORD>" \
                --wait

              xcrun stapler staple DeviceViewer

          Signing and notarization are release-operator responsibilities. The
          workflow never creates, stores or prints credentials.
          EOF
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceViewer-macos-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    # 三个平台全部成功才会发布；任何一个构建失败都会阻断本 job。
    needs:
      - metadata
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          notes="RELEASE_NOTES_${VERSION}.md"
          if [[ -f "${notes}" ]]; then
            cp "${notes}" release-notes.md
          else
            printf '# Device Viewer %s\n\n' "${VERSION}" > release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Device Viewer ${{ needs.metadata.outputs.version }}
          body_path: release-notes.md
          files: release-assets/**
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
